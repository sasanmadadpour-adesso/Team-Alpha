services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vnb
      POSTGRES_PASSWORD: vnb
      POSTGRES_DB: vnb_verification
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnb -d vnb_verification"]
      interval: 5s
      timeout: 5s
      retries: 10
